{{define "theme_switch"}}
<div role="group" class="theme-switch" aria-label="Theme" hidden>
  <button type="button" class="outline secondary" data-theme-choice="system" aria-pressed="false" aria-label="Use system theme" title="Use system theme">{{icon "circle-half-2"}}</button>
  <button type="button" class="outline secondary" data-theme-choice="light" aria-pressed="false" aria-label="Use light theme" title="Use light theme">{{icon "sun"}}</button>
  <button type="button" class="outline secondary" data-theme-choice="dark" aria-pressed="false" aria-label="Use dark theme" title="Use dark theme">{{icon "moon"}}</button>
</div>
{{end}}
